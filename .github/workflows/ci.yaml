---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache_key_prefix: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}
      - name: Install completion test shell
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: mise exec -- task check:go
        env:
          # Intel macOS cannot sustain concurrent race-test packages plus their builds.
          GOFLAGS: ${{ runner.os == 'macOS' && runner.arch == 'X64' && '-p=1' || '' }}
      - run: ./bin/after --help
      - run: ./bin/after --version
      - run: mise exec -- task demo:inspect
      - run: mise exec -- task examples
      - run: mise exec -- task package
      - name: Verify package checksums
        run: for package in dist/*; do (cd "$package" && shasum -a 256 -c SHA256SUMS); done
  poc:
    # The Python proof pins an arm64 manifest; use a native matching host.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cli-entry
            task: test:poc -- --package cmd/after
          - name: browser
            task: test:poc -- --package internal/browser
          - name: capture
            task: test:poc -- --package internal/capture
          - name: cli
            task: test:poc -- --package internal/cli
          - name: compare
            task: test:poc -- --package internal/compare
          - name: payment
            task: test:poc -- --package internal/paymentfixture
          - name: rawdiff
            task: test:poc -- --package internal/rawdiff
          - name: review
            task: test:poc -- --package internal/review
          - name: runner
            task: test:poc -- --package internal/runner
          - name: sandbox
            task: test:poc -- --package internal/sandbox
          - name: terminal
            task: test:poc -- --package internal/terminal
          - name: demo
            task: demo:proof
          - name: study-A
            task: study:proof -- --study-case A
          - name: study-B
            task: study:proof -- --study-case B
          - name: study-C
            task: study:proof -- --study-case C
    name: poc (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache_key_prefix: mise-poc-${{ hashFiles('mise.toml') }}
      - name: Install completion test shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      # Trusted CI setup, separate from AFTER execution. Runs never pull images.
      - name: Provision the pinned offline images
        timeout-minutes: 3
        run: |
          for image in \
            docker.io/library/golang@sha256:e0174e51e81218523251d85d248a90d24c3d5e81543b4f07a5d66229397db190 \
            docker.io/library/python@sha256:cf97c3b79da1c706532c7042f851654d97d3b88c8ca6520acda9cf4479ea9b14; do
            docker pull --platform linux/arm64 "$image" ||
              docker pull --platform linux/arm64 "$image" ||
              docker pull --platform linux/arm64 "$image" || exit 1
          done
      - name: Execute bounded proof slice
        timeout-minutes: 13
        shell: bash
        run: |
          mkdir -p artifacts/poc
          export AFTER_DOCKER_BINARY="$(command -v docker)"
          export AFTER_DOCKER_HOST=unix:///var/run/docker.sock
          mise exec -- go version
          docker version
          docker image inspect docker.io/library/golang@sha256:e0174e51e81218523251d85d248a90d24c3d5e81543b4f07a5d66229397db190 --format '{{.Id}} {{.RepoDigests}}'
          mise exec -- task ${{ matrix.task }} 2>&1 | tee artifacts/poc/gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-${{ matrix.name }}
          path: artifacts/poc
  tooling-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          cache_key_prefix: mise-${{ hashFiles('mise.toml') }}
      - name: Install completion test shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise exec -- task check:tools format:check test:docs secrets
      - run: mise exec -- bunx --no-install playwright install --with-deps chromium
      - run: mise exec -- task docs:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-check
          path: artifacts/presentation
