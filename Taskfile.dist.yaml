---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install pinned tools, documentation dependencies, and Git hooks
    cmds:
      - mise trust
      - mise install
      - task: setup:worktree

  setup:worktree:
    desc: Prepare a checkout without starting services or copying secrets
    cmds:
      - task: check:tools
      - bun install --frozen-lockfile
      - lefthook install

  check:staged:
    desc: Check staged formatting and secrets before committing
    cmd: lefthook run pre-commit

  check:
    desc: Check Go, tooling, documentation and secrets
    cmds:
      - task: check:tools
      - task: format:check
      - task: test
      - task: check:go
      - task: secrets

  check:tools:
    desc: Verify the Backlog and Worktrunk release binaries are executable
    cmds:
      - backlog --version
      - wt --version

  format:check:
    desc: Check supported text formats
    cmd: prettier --check .

  format:
    desc: Format supported text formats
    cmd: prettier --write .

  secrets:
    desc: Scan tracked content for secrets
    cmd: gitleaks git --redact --no-banner

  build:
    desc: Build the native CLI (no runtime dependencies)
    cmd: go build -mod=readonly -trimpath -o bin/after ./cmd/after

  cli:run:
    desc: Run the CLI from source (pass arguments after --)
    cmd: go run -mod=readonly ./cmd/after {{.CLI_ARGS}}

  package:
    desc: Build unpublished versioned macOS/Linux amd64/arm64 binaries and SHA256SUMS
    env:
      GOTOOLCHAIN: local
    cmd: go run ./internal/packagebuild

  demo:
    desc: Walk the real owned payment demo (two exact-plan consent prompts; see docs/DEMO.md)
    cmds:
      - task: build
      - go run ./internal/demo --execute {{.CLI_ARGS}}

  demo:inspect:
    desc: Walk capture and imported reported evidence without Docker or project execution
    cmds:
      - task: build
      - go run ./internal/demo {{.CLI_ARGS}}

  demo:proof:
    desc: Explicitly authorize both synthetic demo plans and verify actual observations (no prompts)
    cmds:
      - task: build
      - go run ./internal/demo --execute --authorize-synthetic-plans {{.CLI_ARGS}}

  examples:
    desc: Smoke-test every example that needs no Docker (see examples/README.md)
    env:
      AFTER_EXAMPLES_STEP: "0"
    cmds:
      - task: build
      - examples/cli/01-working-tree.sh
      - examples/cli/02-staged-and-branches.sh
      - examples/cli/03-moved-oracle.sh
      - examples/cli/04-config.sh
      - examples/cli/08-junit-report.sh
      - AFTER_EXAMPLES_PREPARE_ONLY=1 examples/tui/01-raw-review.sh
      - AFTER_EXAMPLES_PREPARE_ONLY=1 examples/tui/02-test-reports.sh

  demo:gifs:
    desc: Record the example GIFs with VHS (needs ttyd on PATH and the Docker sandbox)
    cmds:
      - task: build
      - for: [payment, oracle, review]
        cmd: mise exec ffmpeg@8.1.1 vhs@0.11.0 -- vhs examples/demos/{{.ITEM}}.tape

  study:assign:
    desc: Print reproducible anonymous study assignments (supply --assign-seed via CLI_ARGS)
    cmd: go run ./internal/demo --assign-seed study-v1 {{.CLI_ARGS}}

  study:check:
    desc: Check study assignment balance and native missing-evidence case setup without Docker
    cmd: go test -race ./internal/demo

  study:proof:
    desc: Authorize six synthetic offline study runs and validate independent keys (author rehearsal only)
    cmds:
      - task: build
      - go run ./internal/demo --study --execute --authorize-synthetic-plans {{.CLI_ARGS}}

  test:go:
    desc: Run Go tests with race detection (macOS/Linux amd64/arm64; requires C compiler)
    # Keep other package binaries from competing with terminal latency budgets.
    cmd: go test -race -p=1 ./...

  test:poc:
    desc: Authorize the complete synthetic adversarial Docker/PTY gate and mutation controls (no skips)
    env:
      AFTER_POC_PROOF: "1"
    cmd: go run ./internal/pocgate

  test:reports:
    desc: Verify offline report parsing, CLI import and shared CLI/TUI cards
    cmds:
      - go test -race ./internal/gotestreport
      - go test -race ./internal/cli ./internal/browser -run 'Test(Import|JUnit|Report|Help|CommandHelp|Card|Discovery)' {{.CLI_ARGS}}

  test:cli:
    desc: Run focused CLI, configuration, and native entry point tests
    cmd: go test -race ./internal/config ./internal/cli ./cmd/after

  cli:help:update:
    desc: Regenerate readable CLI help goldens after reviewing help text changes
    cmd: go test -race ./internal/cli -run '^TestCommandHelpGoldens$' -update

  test:terminal:
    desc: Check terminal safety, computed/captured diffs, browser budgets and actual PTY restoration
    cmd: go test -race -v ./internal/terminal ./internal/rawdiff ./internal/browser

  test:computed:
    desc: Check bounded computed source diffs, browser integration and responsive PTY review
    cmd: go test -race -v ./internal/rawdiff ./internal/browser -run '^(FuzzUnifiedDiffAppliesAndIsDeterministic|TestComputed.*|TestPairWithoutSharedPatchNeverUsesAnotherPatch|TestChangesDiffNavigationAndCapturedBytes|TestResponsiveFramePTY)$'

  test:tui-mutations:
    desc: Check confirmed TUI pin, snapshot and acceptance prompt behavior
    cmd: go test -race -v ./internal/browser -run '^Test(PinPromptReasonDuplicateAndCancellation|SnapshotUsePromptRetainsBaseAndHistoryReason|AcceptPinPromptEngineAndCancellation|AcceptHintUnavailableWithoutCurrentPin|PromptReasonBoundsAndEmptyRefusal)$'

  test:views:
    desc: Check deterministic browser golden views (pass -- -update only to regenerate)
    cmd: go test -race ./internal/browser -run '^TestGoldenViews$' {{.CLI_ARGS}}

  terminal:bench:
    desc: Measure the captured 50-file 100000-line viewport (no project execution)
    cmd: go test ./internal/terminal -run '^TestCapturedDiffBudget$' -bench BenchmarkCapturedViewport -benchmem -count=1

  terminal:fuzz:
    desc: Fuzz terminal-safe text and width bounds
    cmd: go test ./internal/terminal -run '^$' -fuzz FuzzLine -fuzztime 5s

  tui:proof:
    desc: Authorize the real payment pin-edit-reopen-rerun loop in a PTY (requires explicit AFTER_DOCKER_BINARY/HOST)
    env:
      AFTER_TUI_PROOF: "1"
    cmd: go test -race -v -count=1 -timeout=15m ./internal/cli -run '^TestReviewLoopPTYProof$'

  cli:proof:
    desc: Authorize the real paired payment comparison through CLI subprocesses (requires pinned Docker image and explicit AFTER_DOCKER_BINARY/HOST)
    env:
      AFTER_CLI_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./cmd/after -run '^TestPaymentCLIProof$'

  fixtures:junit:
    desc: Capture synthetic JUnit reports (explicit network/toolchain execution; see docs/JUNIT-REPORTS.md)
    cmd: python3 scripts/capture-junit.py

  fixtures:go-report:
    desc: Regenerate synthetic Go report fixtures (intentional test/build failures)
    dir: internal/gotestreport/testdata/source
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    cmds:
      - go version > ../producer.txt
      - if go test -json -count=1 ./cases ./other > ../tests.jsonl; then exit 1; else test $? -eq 1; fi
      - if go test -json -count=1 ./buildfail > ../build.jsonl; then exit 1; else test $? -eq 1; fi
      - go test -json -run '^$' ./other > ../no-tests.jsonl
      - if go test -json -timeout=invalid > ../empty.jsonl 2> /dev/null; then exit 1; else test $? -eq 2; fi

  fixtures:payment:
    desc: Authorize synthetic captured payment experiments in offline Docker (requires provisioned image and explicit AFTER_DOCKER_BINARY/HOST)
    env:
      AFTER_PAYMENT_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./internal/paymentfixture -run TestPaymentProof

  runner:proof:
    desc: Authorize synthetic protected paired payment runs and lifecycle probes in offline Docker
    env:
      AFTER_RUNNER_PROOF: "1"
    cmds:
      - go test -v -count=1 -timeout=15m ./internal/runner -run TestRunnerProof
      - go test -v -count=1 -timeout=5m ./internal/sandbox -run TestObservedProof

  comparison:proof:
    desc: Authorize real synthetic paired payment comparison with exact stored witnesses
    env:
      AFTER_COMPARISON_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./internal/compare -run TestComparisonProof

  http-service:proof:
    desc: Authorize the synthetic dependency-free Python HTTP-service scenario on its pinned image
    env:
      AFTER_HTTP_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./internal/compare -run TestPythonHTTPServiceProof

  command:check:
    desc: Check bounded command definition, consent plan, and comparison regressions without Docker
    cmd: go test -race ./internal/runner ./internal/compare ./internal/cli -run '^TestCommand'

  command:proof:
    desc: Authorize the synthetic command CLI comparison and pin/reopen flow on the provisioned Go image
    env:
      AFTER_COMMAND_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./internal/cli -run '^TestCommandCLIProof$'

  comparison:fuzz:
    desc: Exercise bounded exact JSON comparison properties
    cmd: go test ./internal/compare -run '^$' -fuzz FuzzJSON -fuzztime 5s

  sandbox:proof:
    desc: Authorize synthetic offline Docker isolation probes (requires separately provisioned image and explicit AFTER_DOCKER_BINARY/HOST)
    env:
      AFTER_SANDBOX_PROOF: "1"
    cmd: go test -v -count=1 -timeout=15m ./internal/sandbox -run TestDockerProof

  format:go:
    desc: Format Go sources
    cmd: gofmt -w cmd internal

  check:go:
    desc: Build, race-test, vet, find unused code and check Go formatting
    cmds:
      - task: build
      - task: test:go
      - go vet ./...
      - staticcheck -checks U1000 ./...
      - |
        unformatted="$(gofmt -l cmd internal)"
        if [ -n "$unformatted" ]; then
          printf 'Run task format:go for:\n%s\n' "$unformatted"
          exit 1
        fi

  test:
    desc: Test Go, documentation links and the executable backlog graph
    cmds:
      - task: test:go
      - bun scripts/check-docs.mjs
      - bun scripts/check-backlog.mjs

  docs:check:
    desc: Exercise the presentation in Chromium without modifying committed artifacts
    cmd: bun scripts/check-presentation.mjs

  docs:render:
    desc: Check the presentation and regenerate its PDF and preview
    cmd: bun scripts/check-presentation.mjs --render

  docs:browser:install:
    desc: Install the pinned Playwright Chromium browser
    cmd: bunx --no-install playwright install chromium
